name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: 'Features'
    labels:
      - 'feat'
  - title: 'Fixes'
    labels:
      - 'fix'
  - title: 'Maintenance'
    labels:
      - 'chore'
      - 'refactor'
      - 'deps'

change-template: '- $TITLE (#$NUMBER)'
change-title-escapes: '\\<*_&'

template: |
  ## Changes

  $CHANGES

