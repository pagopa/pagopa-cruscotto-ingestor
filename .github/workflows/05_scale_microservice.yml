name: Scale Microservice Replicas

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        description: Select the Environment
        options:
          - dev
          - uat
          - prod
      minReplica:
        required: true
        type: number
        description: Desired autoscaling minReplica (0 = disable autoscaling and scale the deployment to zero)
        default: 1
      maxReplica:
        required: true
        type: number
        description: Desired autoscaling maxReplica
        default: 1

permissions:
  id-token: write
  contents: read

env:
  APP_NAME: pagopacruscottoingestor

jobs:
  scale:
    runs-on: [self-hosted-job, '${{ inputs.environment }}']
    name: Scale microservice replicas
    environment: ${{ inputs.environment }}
    steps:
      - name: Prepare Helm options
        id: prepare-helm-options
        shell: bash
        run: |
          MIN_REPLICA="${{ inputs.minReplica }}"
          MAX_REPLICA="${{ inputs.maxReplica }}"
          if ! [[ "$MIN_REPLICA" =~ ^[0-9]+$ ]]; then
            echo "ERROR: minReplica must be a non-negative integer"
            exit 1
          fi
          if ! [[ "$MAX_REPLICA" =~ ^[0-9]+$ ]]; then
            echo "ERROR: maxReplica must be a non-negative integer"
            exit 1
          fi
          if [ "$MIN_REPLICA" -gt "$MAX_REPLICA" ]; then
            echo "ERROR: minReplica cannot be greater than maxReplica"
            exit 1
          fi

          if [ "$MIN_REPLICA" -eq 0 ]; then
            echo "Scale-to-zero requested: disabling autoscaling and setting deployment.replicas=0"
            HELM_UPGRADE_OPTIONS="--debug --set microservice-chart.azure.workloadIdentityClientId=${{ vars.WORKLOAD_IDENTITY_ID }} --set microservice-chart.autoscaling.enable=false --set microservice-chart.deployment.replicas=0"
          else
            HELM_UPGRADE_OPTIONS="--debug --set microservice-chart.azure.workloadIdentityClientId=${{ vars.WORKLOAD_IDENTITY_ID }} --set microservice-chart.autoscaling.enable=true --set microservice-chart.autoscaling.minReplica=${MIN_REPLICA} --set microservice-chart.autoscaling.maxReplica=${MAX_REPLICA}"
          fi

          {
            echo "helm_upgrade_options<<EOF"
            echo "$HELM_UPGRADE_OPTIONS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy scaling override
        uses: pagopa/github-actions-template/aks-deploy@main
        with:
          branch: ${{ github.ref_name }}
          client_id: ${{ secrets.CD_CLIENT_ID }}
          subscription_id: ${{ secrets.SUBSCRIPTION_ID }}
          tenant_id: ${{ secrets.TENANT_ID }}
          env: ${{ inputs.environment }}
          namespace: ${{ vars.NAMESPACE }}
          cluster_name: ${{ vars.CLUSTER_NAME }}
          resource_group: ${{ vars.CLUSTER_RESOURCE_GROUP }}
          app_name: ${{ env.APP_NAME }}
          helm_upgrade_options: ${{ steps.prepare-helm-options.outputs.helm_upgrade_options }}
          timeout: '10m0s'

      - name: Log status
        shell: bash
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "autoscaling.minReplica: ${{ inputs.minReplica }}"
          echo "autoscaling.maxReplica: ${{ inputs.maxReplica }}"
