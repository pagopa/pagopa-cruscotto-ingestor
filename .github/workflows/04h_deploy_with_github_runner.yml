name: deploy-with-github-runner

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, uat, prod]
      image_tag:
        description: Image tag to deploy
        required: true
        type: string

concurrency:
  group: deploy-runner-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Enforce prod deploy from main only
        run: |
          if [ "${{ github.event.inputs.environment }}" = "prod" ] && [ "${{ github.ref_name }}" != "main" ]; then
            echo "Prod deploy is allowed only from main branch. Current branch: ${{ github.ref_name }}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: |
          helm dependency update helm
          helm lint helm -f "helm/values-${{ github.event.inputs.environment }}.yaml"

  deploy:
    needs: preflight
    runs-on: self-hosted
    environment: ${{ github.event.inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"

      - name: Helm upgrade
        run: |
          helm dependency update helm
          helm upgrade --install cruscotto-ingestor helm \
            --namespace "${{ vars.K8S_NAMESPACE }}" \
            --create-namespace \
            -f "helm/values-${{ github.event.inputs.environment }}.yaml" \
            --set microservice-chart.image.tag="${{ github.event.inputs.image_tag }}"


