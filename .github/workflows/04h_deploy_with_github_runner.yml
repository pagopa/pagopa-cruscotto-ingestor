name: Deploy on AKS

on:
  workflow_call:
    inputs:
      environment:
        required: true
        description: The name of the environment where to deploy
        type: string
      branch:
        required: false
        default: ${{ github.ref_name }}
        type: string

env:
  APP_NAME: cruscotto-ingestor

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted-job, '${{ inputs.environment }}']
    name: Deploy on AKS
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"

      - name: Deploy with Helm
        run: |
          helm dependency update helm
          helm upgrade --install cruscotto-ingestor helm \
            --namespace "${{ vars.K8S_NAMESPACE }}" \
            --create-namespace \
            -f "helm/values-${{ inputs.environment }}.yaml" \
            --set microservice-chart.image.tag="${{ github.sha }}"
