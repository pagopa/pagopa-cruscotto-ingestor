name: Toggle Ingestion Scheduler

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        description: Select the Environment
        options:
          - dev
          - uat
          - prod
      enabled:
        required: true
        type: choice
        description: Enable or Disable ingestion scheduler
        options:
          - 'true'
          - 'false'

permissions:
  id-token: write
  contents: read

env:
  APP_NAME: pagopacruscottoingestor

jobs:
  toggle:
    runs-on: [self-hosted-job, '${{ inputs.environment }}']
    name: Toggle ingestion scheduler
    environment: ${{ inputs.environment }}
    steps:
      - name: Deploy toggle
        uses: pagopa/github-actions-template/aks-deploy@main
        with:
          branch: ${{ github.ref_name }}
          client_id: ${{ secrets.CD_CLIENT_ID }}
          subscription_id: ${{ secrets.SUBSCRIPTION_ID }}
          tenant_id: ${{ secrets.TENANT_ID }}
          env: ${{ inputs.environment }}
          namespace: ${{ vars.NAMESPACE }}
          cluster_name: ${{ vars.CLUSTER_NAME }}
          resource_group: ${{ vars.CLUSTER_RESOURCE_GROUP }}
          app_name: ${{ env.APP_NAME }}
          helm_upgrade_options: >-
            --debug
            --set microservice-chart.azure.workloadIdentityClientId=${{ vars.WORKLOAD_IDENTITY_ID }}
            --set-string microservice-chart.envConfig.INGESTION_QUARTZ_ENABLED=${{ inputs.enabled }}
          timeout: '10m0s'

      - name: Log status
        shell: bash
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "ingestion.quartz.enabled: ${{ inputs.enabled }}"
