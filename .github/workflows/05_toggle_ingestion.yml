name: Toggle Ingestion

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        description: Select the Environment
        options:
          - dev
          - uat
          - prod
      enabled:
        required: true
        type: choice
        description: Enable or Disable ingestion scheduler
        options:
          - 'true'
          - 'false'

permissions:
  id-token: write
  contents: read

jobs:
  toggle:
    runs-on: ubuntu-latest
    name: Toggle Ingestion on ${{ inputs.environment }}
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4

      - name: Azure Login
        uses: azure/login@92a5484dfaf04ca78a94597f4f19fea633851fa2
        with:
          client-id: ${{ secrets.CD_CLIENT_ID }}
          tenant-id: ${{ secrets.TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION_ID }}

      - name: Setup Helm
        uses: azure/setup-helm@5119fcb9089d432beafd8402a8e9cbb70b7a01fb
        with:
          version: latest

      - name: Toggle Ingestion Scheduler
        shell: bash
        run: |
          helm upgrade cruscotto-ingestor ./helm \
            --namespace crusc8 \
            --reuse-values \
            -f helm/values-${{ inputs.environment }}.yaml \
            --set ingestion.quartz.enabled=${{ inputs.enabled }} \
            --kubeconfig=${{ runner.temp }}/kubeconfig \
            --wait \
            --timeout 5m

      - name: Verify Deployment
        shell: bash
        run: |
          echo "Ingestion scheduler is now: ${{ inputs.enabled == 'true' && 'ENABLED' || 'DISABLED' }}"
          echo "Pod will restart momentarily to apply changes"

      - name: Log Status
        shell: bash
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "Ingestion Enabled: ${{ inputs.enabled }}"
          echo "Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

