# Aggiornamento automatico delle immagini base del Dockerfile.
#
# PERCHE' ESISTE. Le immagini sono pinnate per digest, quindi non si aggiornano da sole: un
# commit produce sempre lo stesso artefatto, ed e' la proprieta' che si vuole. Il rovescio e'
# che il runtime invecchia in silenzio se nessuno rinnova il pin - e' cosi' che la
# CVE-2026-114938 (decoder Base64 di OpenJDK) ha trovato i due backend del cruscotto fermi su
# un'immagine di aprile 2025. Questo file e' la meta' mancante: il pin resta, ma si muove da
# solo e passa comunque da una review.
#
# SOLO DOCKER, per ora. Le dipendenze Maven hanno lo stesso problema, ma aprirebbero molte piu'
# PR: e' una decisione a parte, da prendere quando si sa chi le guarda.
version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Un tetto basso di proposito: le immagini base sono due, e una coda piu' lunga di cosi'
    # significherebbe che nessuno le sta guardando.
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # MAI SALTI DI MAJOR SULLA JVM, e non e' prudenza generica: e' gia' successo.
      # Senza questo blocco Dependabot ha proposto - e qualcuno ha mergiato - il passaggio da
      # Corretto 21 a 26 sul runtime e da 21 a 24 sulla build. Due danni in una volta:
      #   - la build si e' fermata, perche' il parent JHipster accetta JDK 17-23;
      #   - il runtime e' tornato a una linea EOL che contiene 26.0.2.11.1, cioe' l'ultima
      #     versione ancora affetta dalla CVE-2026-114938 che avevamo appena chiuso.
      # La seconda non l'avrebbe vista nessuno se la prima non avesse rotto la pipeline.
      # Gli aggiornamenti di patch dentro la linea 21 restano automatici: sono quelli per cui
      # Dependabot e' qui.
      - dependency-name: "amazoncorretto"
        update-types: ["version-update:semver-major"]
      - dependency-name: "maven"
        update-types: ["version-update:semver-major"]
