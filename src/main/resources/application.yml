spring:
  application:
    name: ingestor
  cloud:
    compatibility-verifier:
      enabled: false

  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:postgresql://10.8.79.25:3306/qualification_dashboard
    username: qualification_dashboard
    password: qualification_dashboard

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: ingestor
        jdbc:
          batch_size: 2000
        order_inserts: true
        order_updates: true

  liquibase:
    default-schema: ingestor
    change-log: classpath:db/migration/liquibase/changelog/db.changelog-master-1.0.0.xml
    contexts: ddl, dml, dev
    enabled: true

  batch:
    jdbc:
      initialize-schema: never
      table-prefix: ingestor.BATCH_
    job:
      enabled: false

server:
  port: 8080
  forward-headers-strategy: native



azure:
  kusto:
    cluster:
      url: https://pagopaddataexplorer.westeurope.kusto.windows.net/
    app:
      id: 8677a3ca-8d05-453f-947c-0bdb1d15e512
      key: qKa8Q~XkMUM_h4C1yzzGKt7Ao4jJ5Vft.rgJ1b1W
    tenant:
      id: 7788edaf-0346-4068-9d79-c868aed15b3d
    database:
      name: re

application:
  mail:
    base-url: http://localhost:8080/
  aws:
    ses:
      user: awsSesUser
  enable-csrf: false
  password:
    day-password-expired: 60
    failed-login-attempts: 4
    hours-key-reset-password-expired: 1
  pago-pa-client:
    proxy-host:
    proxy-port:
    taxonomy:
      url: https://api.platform.pagopa.it/taxonomy/service/v1
    back-office:
      url: https://api.dev.platform.pagopa.it/backoffice/helpdesk/v1
      api-key-name: ocp-apim-subscription-key
      api-key-value: df10628ae8044fdfabd6bbbdc71bdc26
    cache:
      url: https://api.dev.platform.pagopa.it/api-config-cache/p/v1
      api-key-name: ocp-apim-subscription-key
      api-key-value: 52f2f22cf8f94544baf9bfd2760f3dbd
    stand-in:
      url: https://api.uat.platform.pagopa.it/technical-support/stand-in/api/v1
      api-key-name: ocp-apim-subscription-key
      api-key-value: b514df56c9c943bba6cbcf778d698dce #71bce556ab0d4017828fabfe262b8178
  auth-group:
    super-admin: NEXI
  liquibase:
    async-start: false
    dbVersion: 1.0.0

decorator:
  datasource:
    p6spy:
      multiline: true
      logging: slf4j
      enable-logging: false

ingestion:
  # Main ingestion loop defaults
  initial-window: 5m
  max-window-halving-attempts: 10
  bulk-insert-size: 5000
  reconciliation-fetch-limit: 200

  # Guardrails for single run execution
  guardrails:
    enable-max-duration: true
    max-duration: 50m
    enable-max-queries: false
    max-queries: 120
    enable-max-rows: false
    max-rows: 2000000

  # ADX-specific ingestion settings
  adx:
    max-result-size-mb: 64
    query-timeout: 5m
    endpoint: https://pagopaddataexplorer.westeurope.kusto.windows.net/
    database: re

  quartz:
    jobs:
      KUSTO:
        cron: "0 0 * * * ?"
        enabled: true
      POSITION:
        #cron: "0 0 0 * * ?"
        cron: "10 */2 * * * ?"
        enabled: true
      POSITION_TOKENS:
        #cron: "0 0 1 * * ?"
        cron: "20 */2 * * * ?"
        enabled: true
      POSITION_TRANSFERS:
        #cron: "0 0 2 * * ?"
        cron: "30 */2 * * * ?"
        enabled: true
      EXTRA_INFO:
        #cron: "0 0 3 * * ?"
        cron: "50 */2 * * * ?"
        enabled: true
      EVENTS_WF:
        #cron: "0 0 4 * * ?"
        cron: "40 */2 * * * ?"
        enabled: true
      RECONCILIATION:
        #cron: "0 5 * * * ?"
        cron: "5 */2 * * * ?"
        enabled: true

