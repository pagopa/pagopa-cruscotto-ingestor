spring:
  application:
    name: ingestor
  cloud:
    compatibility-verifier:
      enabled: false

  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:postgresql://10.8.79.25:3306/qualification_dashboard
    username: qualification_dashboard
    password: qualification_dashboard

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: ${ingestion.database.schema:sert_ingestor}
        jdbc:
          batch_size: 2000
        order_inserts: true
        order_updates: true

  liquibase:
    default-schema: ${ingestion.database.schema:sert_ingestor}
    change-log: classpath:db/migration/liquibase/changelog/db.changelog-master-1.0.0.xml
    contexts: ddl, dml, dev
    enabled: true

  batch:
    jdbc:
      initialize-schema: never
      table-prefix: ${ingestion.database.schema:sert_ingestor}.BATCH_
    job:
      enabled: false

server:
   port: 8080
   forward-headers-strategy: native

