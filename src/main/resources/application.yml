ingestion:
  database:
    schema: ${APP_DB_SCHEMA_NAME:${INGESTION_DATABASE_SCHEMA:sert_ingestor}}

  # ─── Core loop ──────────────────────────────────────────────────────────────
  initial-window: 5m
  first-run-lookback: P6M
  max-window-halving-attempts: 10
  bulk-insert-size: 10000

  # ─── Execution Log ───────────────────────────────────────────────────────────
  executionLog:
    enabled: true
    retentionDays: 2
    cleanupCron: "0 0 2 * * *"
    trackInsertedIds: false
    maxTrackedIds: 1000

  # ─── Domain transforms ──────────────────────────────────────────────────────
  transforms:
    position:
      # Finestra di deduplicazione POSITION in base a (NAV + PA_EMITTENTE)
      window-hours: 24

  # ─── Checkpoint ─────────────────────────────────────────────────────────────
  checkpoint:
    # Aggiorna il checkpoint solo se il bulk insert va a buon fine
    update-only-on-success: true

  # ─── Staging / error handling ────────────────────────────────────────────────
  staging:
    enabled: true
    # Numero di tentativi prima che il record diventi PARKED.
    # Valore alto per dare margine alla catena di dipendenze (POSITION → TOKEN → EXTRA_INFO).
    max-retries: 20
    # Dopo questo intervallo i record PARKED tornano automaticamente PENDING (retry_count=0).
    # Garantisce che nessuna riga ADX venga persa: quando il padre viene ingestato,
    # il figlio viene rimesso in coda e il tentativo successivo ha successo.
    unpark-after: 30m

  # ─── Anagrafica cache (locale per pod, non distribuita) ─────────────────────
  anagrafica:
    cache:
      enabled: true
      ttl-minutes: 60
      max-size: 10000

  # ─── Reconciliation ─────────────────────────────────────────────────────────
  reconciliation:
    enabled: true
    batch-size: 500

  # ─── Guardrails ──────────────────────────────────────────────────────────────
  guardrails:
    enable-max-duration: true
    #max-duration: 50m
    max-duration: 30s
    enable-max-queries: false
    max-queries: 120
    enable-max-rows: false
    max-rows: 2000000

  # ─── ADX ─────────────────────────────────────────────────────────────────────
  adx:
    max-result-size-mb: 64
    query-timeout: 5m
    endpoint: https://pagopaddataexplorer.westeurope.kusto.windows.net/
    database: re
    windows:
      POSITION: 5m
      POSITION_TOKENS: 5m
      POSITION_TRANSFERS: 5m
      EXTRA_INFO: 5m
      EVENTS_WF: 5m
    tables:
      POSITION: P_SERT_POSITION
      POSITION_TOKENS: P_SERT_POSITION_TOKENS
      POSITION_TRANSFERS: P_SERT_TRANSFERS
      EXTRA_INFO: P_SERT_EXTRA_INFO
      EVENTS_WF: P_SERT_EVENTS_WF

  quartz:
    thread-count: 3
    jobs:
      POSITION:
        #cron: "0 0 0 * * ?"
        cron: "10 */2 * * * ?"
        enabled: true
      POSITION_TOKENS:
        #cron: "0 0 1 * * ?"
        cron: "50 */2 * * * ?"
        enabled: true
      POSITION_TRANSFERS:
        #cron: "0 0 2 * * ?"
        cron: "30 1/2 * * * ?"
        enabled: true
      EXTRA_INFO:
        #cron: "0 0 3 * * ?"
        cron: "40 1/2 * * * ?"
        enabled: true
      EVENTS_WF:
        #cron: "0 0 4 * * ?"
        cron: "50 1/2 * * * ?"
        enabled: true
      RECONCILIATION:
        #cron: "0 5 * * * ?"
        cron: "5 */2 * * * ?"
        enabled: true

# ─── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    it.pagopa.cruscotto.ingestion: INFO
    it.pagopa.cruscotto.ingestion.service.ingestion: DEBUG
    it.pagopa.cruscotto.ingestion.service.AnagraficaService: DEBUG
