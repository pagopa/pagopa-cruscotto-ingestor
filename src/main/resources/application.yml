spring:
  application:
    name: ingestor
  cloud:
    compatibility-verifier:
      enabled: false

  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cruscotto}
    username: ${SPRING_DATASOURCE_USERNAME:cruscotto}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: ${ingestion.database.schema:sert_ingestor}
        jdbc:
          batch_size: 2000
        order_inserts: true
        order_updates: true

  liquibase:
    default-schema: ${ingestion.database.schema:sert_ingestor}
    parameters:
      schema_name: ${ingestion.database.schema:sert_ingestor}
    contexts: ddl, dml, dev
    enabled: ${SPRING_LIQUIBASE_ENABLED:true}

  batch:
    jdbc:
      initialize-schema: never
      table-prefix: ${ingestion.database.schema:sert_ingestor}.BATCH_
    job:
      enabled: ${SPRING_BATCH_JOB_ENABLED:false}

server:
   port: ${SERVER_PORT:8080}
   forward-headers-strategy: native

azure:
  kusto:
    cluster:
      url: ${AZURE_KUSTO_CLUSTER_URL:https://pagopaddataexplorer.westeurope.kusto.windows.net/}
    app:
      id: ${AZURE_KUSTO_APP_ID:}
      key: ${AZURE_KUSTO_APP_KEY:}
    tenant:
      id: ${AZURE_KUSTO_TENANT_ID:}

application:
  liquibase:
    async-start: false
    dbVersion: 1.0.0

ingestion:
  database:
    schema: ${APP_DB_SCHEMA_NAME:${INGESTION_DATABASE_SCHEMA:sert_ingestor}}

  # ─── Core loop ──────────────────────────────────────────────────────────────
  initial-window: 5m
  first-run-start: 2026-03-23T00:00:00Z
  max-window-halving-attempts: 10
  bulk-insert-size: 10000

  # ─── Persistence (Postgres bulk-write safety) ────────────────────────────────
  # Bound lock acquisition and statement execution on the bulk-write path so a
  # lock wait can never hang a run indefinitely (which, with
  # @DisallowConcurrentExecution, would permanently block the Quartz job).
  # Set to 0 to disable a given timeout.
  persistence:
    lock-timeout: 30s
    statement-timeout: 5m
    # Warn (not fail) when a single window write to Postgres exceeds this, to surface
    # degrading DB performance before it turns into a full hang. Set to 0 to disable.
    slow-write-warn-threshold: 10s
    # Retry the per-window transaction on transient DB lock failures (Postgres deadlock,
    # lock timeout, serialization). During catch-up multiple jobs update the same position
    # rows concurrently; the deadlock loser almost always succeeds on retry. Re-runs the
    # in-memory window in a fresh transaction (no ADX re-read). Harmless at regime.
    # Set enabled=false or max-attempts=1 to disable.
    retry:
      enabled: true
      max-attempts: 3
      initial-backoff: 200ms
      max-backoff: 2s
      multiplier: 2.0

  # ─── Health / stuck-job watchdog ─────────────────────────────────────────────
  # Surfaces Quartz jobs still executing beyond blocked-trigger-threshold (a hung run
  # blocks its trigger via @DisallowConcurrentExecution and freezes the chain). Exposed
  # on /management/health, as the ingestor.quartz.stuck.jobs Prometheus gauge and a
  # structured ERROR log (phase=STUCK_JOB). Kept out of the liveness/readiness groups so
  # it alerts without restarting the pod. Set enabled=false or threshold=0 to disable.
  # INVARIANT: blocked-trigger-threshold MUST be greater than the largest guardrail
  # max-duration (including events-wf catchup), otherwise a legitimately long catch-up
  # run would be flagged as stuck. Base events-wf catchup can reach 120m locally, so the
  # base default is aligned to 120m; profiles override with tighter values (dev/uat 45m,
  # prod 90m) matching their own guardrails.
  health:
    enabled: true
    blocked-trigger-threshold: 120m
    check-interval-ms: 60000

  # ─── Execution Log ───────────────────────────────────────────────────────────
  executionLog:
    enabled: true
    retentionDays: 2
    cleanupCron: "0 0 2 * * *"

  # ─── Staging / error handling ────────────────────────────────────────────────
  staging:
    enabled: true
    # Numero di tentativi prima che il record diventi PARKED.
    # Valore alto per dare margine alla catena di dipendenze (POSITION → TOKEN → EXTRA_INFO).
    max-retries: 20
    # Dopo questo intervallo i record PARKED tornano automaticamente PENDING (retry_count=0).
    # Garantisce che nessuna riga ADX venga persa: quando il padre viene ingestato,
    # il figlio viene rimesso in coda e il tentativo successivo ha successo.
    unpark-after: 30m

  staging-error-cleanup:
    enabled: true
    retention: 7d
    cron: "0 45 2 * * ?"

  # ─── Anagrafica cache (locale per pod, non distribuita) ─────────────────────
  anagrafica:
    cache:
      enabled: true
      ttl-minutes: 60
      max-size: 10000

  # ─── Reconciliation ─────────────────────────────────────────────────────────
  reconciliation:
    enabled: true
    batch-size: 500

  token-registry-cleanup:
    enabled: true
    retention: 7d
    cron: "0 30 2 * * ?"

  # ─── Guardrails ──────────────────────────────────────────────────────────────
  guardrails:
    enable-max-duration: true
    #max-duration: 50m
    max-duration: 120s
    enable-max-queries: false
    max-queries: 120
    enable-max-rows: false
    max-rows: 2000000

  # ─── ADX ─────────────────────────────────────────────────────────────────────
  adx:
    max-result-size-mb: 64
    query-timeout: 5m
    endpoint: ${INGESTION_ADX_ENDPOINT:${AZURE_KUSTO_CLUSTER_URL:https://pagopaddataexplorer.westeurope.kusto.windows.net/}}
    database: ${INGESTION_ADX_DATABASE:${AZURE_KUSTO_DATABASE_NAME:re}}
    windows:
      POSITION: 5m
      POSITION_TOKENS: 5m
      POSITION_TRANSFERS: 5m
      EXTRA_INFO: 5m
      EVENTS_WF: 3m
    tables:
      POSITION: P_SERT_POSITION
      POSITION_TOKENS: P_SERT_POSITION_TOKENS
      POSITION_TRANSFERS: P_SERT_TRANSFERS
      EXTRA_INFO: P_SERT_EXTRA_INFO
      EVENTS_WF: P_SERT_EVENTS_WF
      PA: PA
      PSP: PSP
      INTERMEDIARI_PA: INTERMEDIARI_PA
      INTERMEDIARI_PSP: INTERMEDIARI_PSP

  events-wf:
    catchup:
      enabled: true
      lag-threshold: 2h
      window: 30m
      max-duration: 120m
    dedicated:
      enabled: true
      backlog-threshold: 1h
      extra-runs-when-backlogged: 6
    prefetch:
      enabled: true
      min-distinct-token-keys: 100
      min-distinct-position-keys: 100

  quartz:
    thread-count: 5
    jobs:
      POSITION:
        #cron: "0 0 0 * * ?"
        cron: "10 */2 * * * ?"
        enabled: true
      POSITION_TOKENS:
        #cron: "0 0 1 * * ?"
        cron: "50 */2 * * * ?"
        enabled: true
      EVENTS_WF:
        #cron: "0 0 4 * * ?"
        cron: "10 1/2 * * * ?"
        enabled: true
      POSITION_TRANSFERS:
        #cron: "0 0 2 * * ?"
        cron: "30 1/2 * * * ?"
        enabled: true
      EXTRA_INFO:
        #cron: "0 0 3 * * ?"
        cron: "40 1/2 * * * ?"
        enabled: true
      ANAG_DESCRIPTION_REFRESH:
        #cron: "0 0 0 * * ?"
        cron: "0 0/5 * * * ?"
        enabled: true
      RECONCILIATION:
        #cron: "0 5 * * * ?"
        cron: "5 */2 * * * ?"
        enabled: true

# ─── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    it.pagopa.cruscotto.ingestion: INFO
    it.pagopa.cruscotto.ingestion.service.ingestion: DEBUG
    it.pagopa.cruscotto.ingestion.service.AnagraficaService: DEBUG

---
springdoc:
  api-docs:
    path: /api-docs
  show-actuator: true
  paths-to-match: /api/**, /management/**

---
management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include:
          - configprops
          - env
          - health
          - info
          - jhimetrics
          - jhiopenapigroups
          - logfile
          - loggers
          - prometheus
          - threaddump
          - caches
  endpoint:
    health:
      show-details: when_authorized
      roles: 'ROLE_ADMIN'
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
        # Dedicated group for stuck-job alerting: scrape /management/health/quartz.
        # Intentionally separate from liveness/readiness so a stuck job never affects
        # the Kubernetes probes.
        quartz:
          include: quartzStuckJobs
    jhimetrics:
      enabled: true
  info:
    git:
      mode: full
    env:
      enabled: true
  health:
    mail:
      enabled: false # When using the MailService, configure an SMTP server and set this to true
  prometheus:
    metrics:
      export:
        enabled: true
        step: 60
  observations:
    key-values:
      application: ${spring.application.name}
  metrics:
    enable:
      http: true
      jvm: true
      logback: true
      process: true
      system: true
    distribution:
      percentiles-histogram:
        all: true
      percentiles:
        all: 0, 0.5, 0.75, 0.95, 0.99, 1.0
    data:
      repository:
        autotime:
          enabled: true
    tags:
      application: ${spring.application.name}