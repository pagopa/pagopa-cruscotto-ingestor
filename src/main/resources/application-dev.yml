spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # DEV: aligned with quartz thread-count=5 to avoid connection starvation
      maximum-pool-size: 15
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    properties:
      hibernate:
        jdbc:
          # DEV: smaller JDBC batches to reduce memory spikes
          batch_size: 500

  liquibase:
    enabled: ${SPRING_LIQUIBASE_ENABLED:true}

  batch:
    job:
      enabled: ${SPRING_BATCH_JOB_ENABLED:false}

server:
  port: ${SERVER_PORT:8080}

azure:
  kusto:
    cluster:
      url: ${AZURE_KUSTO_CLUSTER_URL}
    app:
      id: ${AZURE_KUSTO_APP_ID}
      key: ${AZURE_KUSTO_APP_KEY}
    tenant:
      id: ${AZURE_KUSTO_TENANT_ID}

ingestion:
  database:
    schema: ${INGESTION_DATABASE_SCHEMA:sert_ingestor}

  # DEV: reduce ingestion pressure (ADX, JVM and DB)
  bulk-insert-size: 1000
  first-run-start: 2026-03-23T00:00:00Z
  reconciliation:
    batch-size: 100
  guardrails:
    enable-max-duration: true
    max-duration: 25m
    enable-max-queries: true
    max-queries: 40
    enable-max-rows: true
    max-rows: 150000
  adx:
    max-result-size-mb: 64
    query-timeout: 8m
    endpoint: ${INGESTION_ADX_ENDPOINT:${AZURE_KUSTO_CLUSTER_URL}}
    database: ${INGESTION_ADX_DATABASE:${AZURE_KUSTO_DATABASE_NAME:re}}
    windows:
      POSITION: 5m
      POSITION_TOKENS: 5m
      POSITION_TRANSFERS: 5m
      EXTRA_INFO: 5m
      EVENTS_WF: 2m
  events-wf:
    catchup:
      enabled: true
      lag-threshold: 30m
      window: 8m
      max-duration: 30m
    dedicated:
      enabled: true
      backlog-threshold: 30m
      extra-runs-when-backlogged: 1
  quartz:
    thread-count: 5
    jobs:
      POSITION:
        cron: "0 0/30 * * * ?"
        enabled: true
      POSITION_TOKENS:
        cron: "0 5/30 * * * ?"
        enabled: true
      POSITION_TRANSFERS:
        cron: "0 10/30 * * * ?"
        enabled: true
      EXTRA_INFO:
        cron: "0 15/30 * * * ?"
        enabled: true
      EVENTS_WF:
        cron: "0 20/30 * * * ?"
        enabled: true
      ANAG_DESCRIPTION_REFRESH:
        cron: "0 0 * * * ?"
        enabled: true
      RECONCILIATION:
        cron: "0 15 * * * ?"
        enabled: true
