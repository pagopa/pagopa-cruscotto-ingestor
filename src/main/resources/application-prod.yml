spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # PROD: highest pool to sustain peak ingestion concurrency
      maximum-pool-size: 35
      minimum-idle: 10
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 900000
      # Detect stale pooled connections before handing them to a worker
      keepalive-time: 120000
      data-source-properties:
        # Client-side socket read timeout (seconds) so a dead TCP connection can never
        # hang a run indefinitely. Kept just above statement_timeout (5m) so the
        # server-side timeout fires first for genuinely long statements.
        socketTimeout: 360
        tcpKeepAlive: true
        connectTimeout: 10

  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 10000

  liquibase:
    enabled: ${SPRING_LIQUIBASE_ENABLED:true}

  batch:
    job:
      enabled: ${SPRING_BATCH_JOB_ENABLED:false}

server:
  port: ${SERVER_PORT:8080}

azure:
  kusto:
    cluster:
      url: ${AZURE_KUSTO_CLUSTER_URL}
    app:
      id: ${AZURE_KUSTO_APP_ID}
      key: ${AZURE_KUSTO_APP_KEY}
    tenant:
      id: ${AZURE_KUSTO_TENANT_ID}

ingestion:
  database:
    schema: ${INGESTION_DATABASE_SCHEMA:sert_ingestor}

  # ─── Core loop ──────────────────────────────────────────────────────────────
  bulk-insert-size: 20000
  first-run-start: 2026-07-01T00:00:00Z
  max-window-halving-attempts: 10

  # ─── Execution Log ─────────────────────────────────────────────────────────
  executionLog:
    retentionDays: 14

  # ─── Reconciliation (PROD: aggressive batch) ───────────────────────────────
  reconciliation:
    batch-size: 2000

  # ─── Guardrails (PROD: strong protection with halving) ──────────────────────
  guardrails:
    enable-max-duration: true
    max-duration: 60m
    enable-max-queries: true
    max-queries: 200
    enable-max-rows: true
    max-rows: 10000000

  # ─── ADX (PROD: high-volume optimized, 11B+ rows in EVENTS_WF) ──────────────
  adx:
    max-result-size-mb: 64
    query-timeout: 8m
    endpoint: ${INGESTION_ADX_ENDPOINT:${AZURE_KUSTO_CLUSTER_URL}}
    database: ${INGESTION_ADX_DATABASE:${AZURE_KUSTO_DATABASE_NAME:re}}
    windows:
      EVENTS_WF: 5m

  events-wf:
    catchup:
      enabled: true
      lag-threshold: 2h
      window: 15m
    dedicated:
      enabled: true
      backlog-threshold: 2h
      extra-runs-when-backlogged: 3

  # ─── Job scheduling (PROD: overnight batch with max parallelism) ───────────
  quartz:
    thread-count: 5
    jobs:
      POSITION:
        cron: "0 0 0 * * ?"
        enabled: true
      POSITION_TOKENS:
        cron: "0 0 1 * * ?"
        enabled: true
      EVENTS_WF:
        cron: "0 0 2 * * ?"
        enabled: true
      POSITION_TRANSFERS:
        cron: "0 0 3 * * ?"
        enabled: true
      EXTRA_INFO:
        cron: "0 0 4 * * ?"
        enabled: true
      ANAG_DESCRIPTION_REFRESH:
        cron: "0 0 * * * ?"
        enabled: true
      RECONCILIATION:
        cron: "0 10 * * * ?"
        enabled: true

logging:
  level:
    it.pagopa.cruscotto.ingestion: INFO
