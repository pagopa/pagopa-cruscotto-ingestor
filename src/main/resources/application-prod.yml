spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # PROD: aligned with UAT/DEV for the initial release
      maximum-pool-size: 25
      minimum-idle: 10
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 900000
      # Detect stale pooled connections before handing them to a worker
      keepalive-time: 120000
      # Log a warning if a connection is held longer than this (ms). Set above the
      # 5m statement-timeout so genuine long writes don't produce false positives.
      leak-detection-threshold: 330000
      data-source-properties:
        # Client-side socket read timeout (seconds) so a dead TCP connection can never
        # hang a run indefinitely. Kept just above statement_timeout (5m) so the
        # server-side timeout fires first for genuinely long statements.
        socketTimeout: 360
        tcpKeepAlive: true
        connectTimeout: 10

  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 500

  liquibase:
    enabled: ${SPRING_LIQUIBASE_ENABLED:true}

  batch:
    job:
      enabled: ${SPRING_BATCH_JOB_ENABLED:false}

server:
  port: ${SERVER_PORT:8080}

azure:
  kusto:
    cluster:
      url: ${AZURE_KUSTO_CLUSTER_URL}
    app:
      id: ${AZURE_KUSTO_APP_ID}
      key: ${AZURE_KUSTO_APP_KEY}
    tenant:
      id: ${AZURE_KUSTO_TENANT_ID}

ingestion:
  database:
    schema: ${INGESTION_DATABASE_SCHEMA:sert_ingestor}

  # PROD: aligned with UAT for the initial release. Guardrail max-duration is 25m
  # (30m events-wf catchup) -> keep the stuck-job threshold safely above it.
  health:
    blocked-trigger-threshold: 45m

  # ─── Core loop (aligned with UAT) ───────────────────────────────────────────
  bulk-insert-size: 1000
  # PROD-specific: backfill origin, kept intentionally (not a tuning value).
  first-run-start: 2026-08-01T00:00:00Z
  max-window-halving-attempts: 10

  # ─── Execution Log (PROD retention kept intentionally) ──────────────────────
  executionLog:
    retentionDays: 14

  # ─── Reconciliation (aligned with UAT) ──────────────────────────────────────
  reconciliation:
    batch-size: 100

  # ─── Guardrails (aligned with UAT) ──────────────────────────────────────────
  guardrails:
    enable-max-duration: true
    max-duration: 25m
    enable-max-queries: false
    max-queries: 40
    enable-max-rows: false
    max-rows: 150000

  # ─── ADX (aligned with UAT) ─────────────────────────────────────────────────
  adx:
    max-result-size-mb: 64
    query-timeout: 8m
    endpoint: ${INGESTION_ADX_ENDPOINT:${AZURE_KUSTO_CLUSTER_URL}}
    database: ${INGESTION_ADX_DATABASE:${AZURE_KUSTO_DATABASE_NAME:re}}
    windows:
      POSITION: 5m
      POSITION_TOKENS: 5m
      POSITION_TRANSFERS: 5m
      EXTRA_INFO: 5m
      EVENTS_WF: 2m
    # PROD ADX tables: no P_ prefix (P_SERT_* -> SERT_*)
    tables:
      POSITION: SERT_POSITION
      POSITION_TOKENS: SERT_POSITION_TOKENS
      POSITION_TRANSFERS: SERT_TRANSFERS
      EXTRA_INFO: SERT_EXTRA_INFO
      EVENTS_WF: SERT_EVENTS_WF
      PA: PA
      PSP: PSP
      INTERMEDIARI_PA: INTERMEDIARI_PA
      INTERMEDIARI_PSP: INTERMEDIARI_PSP

  events-wf:
    catchup:
      enabled: true
      lag-threshold: 30m
      window: 8m
      max-duration: 30m
    dedicated:
      enabled: true
      backlog-threshold: 30m
      extra-runs-when-backlogged: 1

  # ─── Job scheduling (aligned with UAT: every 30m) ───────────────────────────
  quartz:
    thread-count: 5
    jobs:
      POSITION:
        cron: "0 0/30 * * * ?"
        enabled: true
      POSITION_TOKENS:
        cron: "0 5/30 * * * ?"
        enabled: true
      POSITION_TRANSFERS:
        cron: "0 10/30 * * * ?"
        enabled: true
      EXTRA_INFO:
        cron: "0 15/30 * * * ?"
        enabled: true
      EVENTS_WF:
        cron: "0 20/30 * * * ?"
        enabled: true
      ANAG_DESCRIPTION_REFRESH:
        cron: "0 0 * * * ?"
        enabled: true
      RECONCILIATION:
        cron: "0 15 * * * ?"
        enabled: true

logging:
  level:
    it.pagopa.cruscotto.ingestion: INFO
