spring:
  config:
    activate:
      on-profile: uat

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # UAT: moderate connection pool (24h job windows, moderate throughput)
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 5000

  liquibase:
    enabled: ${SPRING_LIQUIBASE_ENABLED:true}

  batch:
    job:
      enabled: ${SPRING_BATCH_JOB_ENABLED:false}

server:
  port: ${SERVER_PORT:8080}

azure:
  kusto:
    cluster:
      url: ${AZURE_KUSTO_CLUSTER_URL}
    app:
      id: ${AZURE_KUSTO_APP_ID}
      key: ${AZURE_KUSTO_APP_KEY}
    tenant:
      id: ${AZURE_KUSTO_TENANT_ID}

ingestion:
  database:
    schema: ${INGESTION_DATABASE_SCHEMA:sert_ingestor}

  # ─── Core loop ──────────────────────────────────────────────────────────────
  bulk-insert-size: 10000
  first-run-start: 2026-07-01T00:00:00Z
  max-window-halving-attempts: 10

  # ─── Execution Log ──────────────────────────────────────────────────────────
  executionLog:
    retentionDays: 7

  # ─── Reconciliation (UAT: conservative batch) ────────────────────────────────
  reconciliation:
    batch-size: 1000

  # ─── Guardrails (UAT: conservative, allow operators to tune) ────────────────
  guardrails:
    enable-max-duration: true
    max-duration: 45m
    enable-max-queries: true
    max-queries: 150
    enable-max-rows: true
    max-rows: 5000000

  # ─── ADX (UAT: volume-aware, 11B+ rows in EVENTS_WF) ───────────────────────
  adx:
    max-result-size-mb: 64
    query-timeout: 8m
    endpoint: ${INGESTION_ADX_ENDPOINT:${AZURE_KUSTO_CLUSTER_URL}}
    database: ${INGESTION_ADX_DATABASE:${AZURE_KUSTO_DATABASE_NAME:re}}
    windows:
      EVENTS_WF: 5m

  events-wf:
    catchup:
      enabled: true
      lag-threshold: 2h
      window: 15m
    dedicated:
      enabled: true
      backlog-threshold: 2h
      extra-runs-when-backlogged: 2

  # ─── Job scheduling (UAT: staggered daily jobs) ──────────────────────────────
  quartz:
    thread-count: 5
    jobs:
      POSITION:
        cron: "0 0 0 * * ?"
        enabled: true
      POSITION_TOKENS:
        cron: "0 0 1 * * ?"
        enabled: true
      EVENTS_WF:
        cron: "0 0 2 * * ?"
        enabled: true
      POSITION_TRANSFERS:
        cron: "0 0 3 * * ?"
        enabled: true
      EXTRA_INFO:
        cron: "0 0 4 * * ?"
        enabled: true
      ANAG_DESCRIPTION_REFRESH:
        cron: "0 0 0 * * ?"
        enabled: true
      RECONCILIATION:
        cron: "0 5 * * * ?"
        enabled: true

logging:
  level:
    it.pagopa.cruscotto.ingestion: INFO
