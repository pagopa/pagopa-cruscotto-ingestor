spring:
  config:
    activate:
      on-profile: uat

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # UAT: aligned with DEV configuration
      maximum-pool-size: 15
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # Detect stale pooled connections before handing them to a worker
      keepalive-time: 120000
      # Log a warning if a connection is held longer than this (ms). Set above the
      # 5m statement-timeout so genuine long writes don't produce false positives.
      leak-detection-threshold: 330000
      data-source-properties:
        # Client-side socket read timeout (seconds) so a dead TCP connection can never
        # hang a run indefinitely. Kept just above statement_timeout (5m) so the
        # server-side timeout fires first for genuinely long statements.
        socketTimeout: 360
        tcpKeepAlive: true
        connectTimeout: 10

  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 500

  liquibase:
    enabled: ${SPRING_LIQUIBASE_ENABLED:true}

  batch:
    job:
      enabled: ${SPRING_BATCH_JOB_ENABLED:false}

server:
  port: ${SERVER_PORT:8080}

azure:
  kusto:
    cluster:
      url: ${AZURE_KUSTO_CLUSTER_URL}
    app:
      id: ${AZURE_KUSTO_APP_ID}
      key: ${AZURE_KUSTO_APP_KEY}
    tenant:
      id: ${AZURE_KUSTO_TENANT_ID}

ingestion:
  database:
    schema: ${INGESTION_DATABASE_SCHEMA:sert_ingestor}

  # UAT: guardrail max-duration is 25m, events-wf catchup max-duration is 60m; keep the
  # stuck-job threshold safely above the largest of them to avoid false positives.
  health:
    blocked-trigger-threshold: 90m

  # UAT: aligned with DEV (reduced ingestion pressure on ADX, JVM and DB)
  bulk-insert-size: 1000
  first-run-start: 2026-03-23T00:00:00Z
  reconciliation:
    batch-size: 100
  guardrails:
    enable-max-duration: true
    max-duration: 25m
    enable-max-queries: false
    max-queries: 40
    enable-max-rows: false
    max-rows: 150000
  adx:
    max-result-size-mb: 64
    query-timeout: 8m
    endpoint: ${INGESTION_ADX_ENDPOINT:${AZURE_KUSTO_CLUSTER_URL}}
    database: ${INGESTION_ADX_DATABASE:${AZURE_KUSTO_DATABASE_NAME:re}}
    windows:
      POSITION: 5m
      POSITION_TOKENS: 5m
      POSITION_TRANSFERS: 5m
      EXTRA_INFO: 5m
      EVENTS_WF: 2m
    # UAT ADX tables: with P_ prefix
    tables:
      POSITION: P_SERT_POSITION
      POSITION_TOKENS: P_SERT_POSITION_TOKENS
      POSITION_TRANSFERS: P_SERT_TRANSFERS
      EXTRA_INFO: P_SERT_EXTRA_INFO
      EVENTS_WF: P_SERT_EVENTS_WF
      PA: PA
      PSP: PSP
      INTERMEDIARI_PA: INTERMEDIARI_PA
      INTERMEDIARI_PSP: INTERMEDIARI_PSP
  events-wf:
    catchup:
      enabled: true
      lag-threshold: 30m
      window: 8m
      max-duration: 60m
    dedicated:
      enabled: true
      backlog-threshold: 30m
      extra-runs-when-backlogged: 1
  quartz:
    thread-count: 5
    jobs:
      POSITION:
        cron: "0 0/30 * * * ?"
        enabled: true
      POSITION_TOKENS:
        cron: "0 5/30 * * * ?"
        enabled: true
      POSITION_TRANSFERS:
        cron: "0 10/30 * * * ?"
        enabled: true
      EXTRA_INFO:
        cron: "0 15/30 * * * ?"
        enabled: true
      EVENTS_WF:
        cron: "0 20/30 * * * ?"
        enabled: true
      ANAG_DESCRIPTION_REFRESH:
        cron: "0 0 * * * ?"
        enabled: true
      RECONCILIATION:
        cron: "0 15 * * * ?"
        enabled: true
