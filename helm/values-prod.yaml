microservice-chart:
  namespace: "crusc8"
  nameOverride: ""
  fullnameOverride: ""
  image:
    repository: ghcr.io/pagopa/pagopa-cruscotto-ingestor
    tag: "0.0.38"
    pullPolicy: Always
  livenessProbe:
    httpGet:
      # livenessState group: "app is alive", independent of Quartz workers, so a long or
      # stuck ingestion run never trips liveness and restarts the pod mid-window.
      path: /management/health/liveness
      port: 8080
    initialDelaySeconds: 45
    failureThreshold: 12
    periodSeconds: 20
  readinessProbe:
    httpGet:
      # readinessState + db group: pod is taken out of service if Postgres is unreachable.
      path: /management/health/readiness
      port: 8080
    initialDelaySeconds: 45
    failureThreshold: 12
    periodSeconds: 20
  deployment:
    create: true
    # Client requirement: run on at least 3 pods in production. Safe only with Quartz
    # instanceId=AUTO (clustered failover) — otherwise all 3 pods run every job concurrently.
    replicas: 3
  service:
    create: true
    type: ClusterIP
    ports:
      - 8080
  ingress:
    create: true
    host: "crusc8.itn.internal.platform.pagopa.it"
    path: /pagopa-pagopa-cruscotto-ingestor-backend-service/(.*)
    servicePort: 8080
  serviceAccount:
    create: false
    annotations: {}
    name: "crusc8-workload-identity"
  podAnnotations: {}
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
  resources:
    requests:
      memory: "1536Mi"
      cpu: "0.50"
    limits:
      memory: "3Gi"
      cpu: "1.00"
  autoscaling:
    enable: true
    # At least 3 pods (client requirement). maxReplica kept at 3 for now: raising it increases
    # total DB connections (pods x hikari max-pool-size) — verify Postgres max_connections before
    # allowing scale-out beyond 3.
    minReplica: 3
    maxReplica: 3
    pollingInterval: 10
    cooldownPeriod: 50
    triggers:
      - type: cpu
        metadata:
          type: Utilization
          value: "75"
      - type: memory
        metadata:
          type: Utilization
          value: "80"
  envConfig:
    SPRING_PROFILES_ACTIVE: "prod"
    SERVER_PORT: "8080"
    # Size the JVM heap to the container memory limit (3Gi). Without this, JDK 17 defaults
    # to MaxRAMPercentage=25% (~768MB) — half of dev/uat — in the highest-volume environment.
    JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
    # Strict mapping: only properties read by Spring/ingestion config
    INGESTION_DATABASE_SCHEMA: "sert_ingestor"
    SPRING_DATASOURCE_URL: "jdbc:postgresql://pagopa-p-itn-crusc8-flexible-postgresql.postgres.database.azure.com:5432/cruscotto?sslmode=require&prepareThreshold=0&reWriteBatchedInserts=true"
    SPRING_DATASOURCE_USERNAME: "cruscotto"
    SPRING_LIQUIBASE_ENABLED: "false"
    SPRING_BATCH_JOB_ENABLED: "false"
    AZURE_KUSTO_CLUSTER_URL: "https://pagopapdataexplorer.westeurope.kusto.windows.net/"
    AZURE_KUSTO_TENANT_ID: "7788edaf-0346-4068-9d79-c868aed15b3d"
    AZURE_KUSTO_DATABASE_NAME: "re"
    INGESTION_ADX_ENDPOINT: "https://pagopapdataexplorer.westeurope.kusto.windows.net/"
    INGESTION_ADX_DATABASE: "re"
  envSecret:
    SPRING_DATASOURCE_PASSWORD: "db-cruscotto-password"
    AZURE_KUSTO_APP_ID: "adx-app-id"
    AZURE_KUSTO_APP_KEY: "adx-app-key"
  keyvault:
    name: "pagopa-p-itn-crusc8-kv"
    tenantId: "7788edaf-0346-4068-9d79-c868aed15b3d"
  nodeSelector: {}
  tolerations: []
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node_type
                operator: In
                values:
                  - user
  canaryDelivery:
    deployment:
      image:
        tag: "0.0.0"
    create: false
